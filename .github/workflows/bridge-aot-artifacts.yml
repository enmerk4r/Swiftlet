name: Bridge AOT Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-22.04
            artifact_name: swiftlet-bridge-linux-x64
            executable: SwiftletBridge
          - rid: osx-arm64
            runner: macos-15
            artifact_name: swiftlet-bridge-osx-arm64
            executable: SwiftletBridge

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Pin .NET 8 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(dotnet --list-sdks | awk '/^8\./ {print $1}' | tail -n 1)"
          if [ -z "$sdk_version" ]; then
            echo "No .NET 8 SDK was found after setup-dotnet." >&2
            dotnet --list-sdks >&2
            exit 1
          fi
          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "latestFeature"\n  }\n}\n' "$sdk_version" > global.json
          dotnet --version

      - name: Show build host
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          dotnet --info

      - name: Require Apple Silicon host
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "osx-arm64 Native AOT must run on an arm64 macOS host. Current host: $(uname -m)" >&2
            exit 1
          fi

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT bridge
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/SwiftletBridge/SwiftletBridge.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:StripSymbols=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "artifacts/bridge/${{ matrix.rid }}"

      - name: Verify bridge artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/bridge/${{ matrix.rid }}/${{ matrix.executable }}"
          chmod +x "artifacts/bridge/${{ matrix.rid }}/${{ matrix.executable }}"
          ls -lah "artifacts/bridge/${{ matrix.rid }}"

      - name: Archive bridge artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/upload
          tar -czf "artifacts/upload/${{ matrix.artifact_name }}.tar.gz" -C "artifacts/bridge/${{ matrix.rid }}" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "artifacts/upload/${{ matrix.artifact_name }}.tar.gz" > "artifacts/upload/${{ matrix.artifact_name }}.tar.gz.sha256"
          else
            shasum -a 256 "artifacts/upload/${{ matrix.artifact_name }}.tar.gz" > "artifacts/upload/${{ matrix.artifact_name }}.tar.gz.sha256"
          fi
          cat "artifacts/upload/${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Upload bridge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/upload/${{ matrix.artifact_name }}.tar.gz
            artifacts/upload/${{ matrix.artifact_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
